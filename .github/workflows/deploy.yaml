name: Deploy Anna SSG to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 
          path: 'site' 

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Download and setup Anna SSG
        run: |
          # Downloads to the root workspace (one level above 'site')
          wget https://github.com/anna-ssg/anna/releases/download/v4.0.0-rc-6/anna_Linux_x86_64.tar.gz
          tar -xzf anna_Linux_x86_64.tar.gz
          chmod +x anna

      - name: Execute dev script
        run: |
          # Navigate into the site folder to run your script
          cd site
          chmod +x dev.sh
          ./dev.sh

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './rendered' 

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
