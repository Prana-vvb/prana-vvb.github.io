{{define "blog"}}
{{template "head" .}}

<body style="display: flex; flex-direction: column; min-height: 100vh; margin: 0;">
    {{template "header" .}}

    <main class="centered-page-grid site-main" style="flex: 1 0 auto; margin-top: 1rem;">
        <aside></aside>

        <section class="center-col">
            <h1 style="font-size: 2rem; margin-bottom: 2rem; font-weight: 400;">posts</h1>

            <div class="post-list" style="display: flex; flex-direction: column;">
                {{range index .DeepDataMerge.CollectionsMap .PageURL}}
                <article class="post-item" style="padding: 2rem 0; border-top: 1px solid rgba(255, 255, 255, 0.1);">
                    <h2 style="margin: 0 0 0.25rem 0; font-size: 1.35rem; font-weight: 600;">
                        <a href="/{{.CompleteURL}}" style="text-decoration: none; color: var(--color-primary);">
                            {{.Frontmatter.Title}}
                        </a>
                    </h2>
                    <div
                        style="color: var(--color-text-dim); font-size: 0.85rem; font-family: monospace; margin-bottom: 0.75rem;">
                        {{.Frontmatter.Date}}
                    </div>
                    <p style="margin: 0; color: var(--color-text); font-size: 0.95rem; line-height: 1.5;">
                        {{.Frontmatter.Description}}
                    </p>
                </article>
                {{else}}
                <p style="color: var(--color-text-dim);">No entries found.</p>
                {{end}}
            </div>
        </section>

        <aside></aside>
    </main>

    {{template "footer" .}}
</body>

</html>
{{end}}
