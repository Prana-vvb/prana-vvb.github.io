{{define "footer"}}

<footer class="site-footer"
    style="border-top: 1px solid rgba(255, 255, 255, 0.2); padding-top: 2rem; margin-top: auto; padding-bottom: 2rem;">

    <div class="container"
        style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 1rem; color: var(--color-text-dim); font-size: 0.85rem; padding: 0 1rem;">

        <div style="text-align: left;">
            <p id="git-commit-display" style="margin: 0;"></p>
        </div>

        <div style="text-align: center;">
            <p style="margin: 0;">
                Rendered by <a href="https://github.com/anna-ssg/anna" target="_blank"
                    style="color: inherit; text-decoration: underline; text-underline-offset: 4px;">anna</a>
            </p>
        </div>

        <div style="text-align: right;">
            <p style="margin: 0;">
                {{.DeepDataMerge.LayoutConfig.Copyright}}
            </p>
        </div>

    </div>

    <div class="container"
        style="display: flex; justify-content: center; align-items: center; gap: 1rem; color: var(--color-text-dim); font-size: 0.85rem; margin-top: 1rem; padding: 0 2rem;">

        <a href="https://homebrew.hsp-ec.xyz/webring" title="Homebrew Webring"
            style="color: inherit; text-decoration: none; display: flex; align-items: center; gap: 0.4rem;">
            Homebrew webring
        </a>

        <a href="https://homebrew.hsp-ec.xyz/ring/prev?site=https://prana-vvb.github.io"
            style="color: inherit; text-decoration: underline; text-underline-offset: 4px;">← Prev</a>

        <a href="https://homebrew.hsp-ec.xyz/ring/random?site=https://prana-vvb.github.io" title="Random"
            aria-label="Random site" style="color: inherit; display: flex; align-items: center;">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="2" width="20" height="20" rx="3" ry="3"></rect>
                <circle cx="8" cy="8" r="1.5" fill="currentColor" stroke="none"></circle>
                <circle cx="16" cy="8" r="1.5" fill="currentColor" stroke="none"></circle>
                <circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"></circle>
                <circle cx="8" cy="16" r="1.5" fill="currentColor" stroke="none"></circle>
                <circle cx="16" cy="16" r="1.5" fill="currentColor" stroke="none"></circle>
            </svg>
        </a>

        <a href="https://homebrew.hsp-ec.xyz/ring/next?site=https://prana-vvb.github.io"
            style="color: inherit; text-decoration: underline; text-underline-offset: 4px;">Next →</a>
    </div>
</footer>

<script src="/static/commit.js"></script>
<script>
    if (typeof GIT_COMMIT !== 'undefined') {
        const commitParts = GIT_COMMIT.split(' ');
        const hash = commitParts[0];
        const remainder = commitParts.slice(1).join(' ');

        const githubRepoUrl = "https://github.com/prana-vvb/site";

        const commitLink = `<a href="${githubRepoUrl}/tree/${hash}" target="_blank" style="color: inherit; text-decoration: underline; text-underline-offset: 4px;">${hash}</a>`;

        document.getElementById('git-commit-display').innerHTML = `${commitLink} ${remainder}`;
    }
</script>

<script src="/static/scripts/lightbox.js"></script>

{{end}}
